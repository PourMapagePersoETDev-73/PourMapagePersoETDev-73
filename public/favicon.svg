<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  <!-- 4 crisp tiles representing the 4 apps in Mon Portail -->
  <rect x="12" y="12" width="18" height="18" rx="4.5" fill="#2563eb" />
  <rect x="34" y="12" width="18" height="18" rx="4.5" fill="#0ea5e9" />
  <rect x="12" y="34" width="18" height="18" rx="4.5" fill="#10b981" />
  <rect x="34" y="34" width="18" height="18" rx="4.5" fill="#f59e0b" />
  <!-- Subtle inner highlights on top-left and bottom-right tiles for depth at 16px -->
  <circle cx="21" cy="21" r="4" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="43" cy="43" r="3.5" fill="#0f172a" fill-opacity="0.22" />
</svg>
